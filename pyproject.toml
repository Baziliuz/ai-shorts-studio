[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-shorts-studio"
version = "0.1.1"
description = "Локальный ручной редактор коротких видео"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.8.3", "platformdirs==4.3.6"]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "pyinstaller==6.12.0"]
[project.scripts]
ai-shorts-studio = "ai_shorts_studio.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
