name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock -r requirements-ai.lock -e ".[dev,analysis]"
      - run: python scripts/fetch_ffmpeg.py
      - name: Add pinned FFmpeg to path
        shell: pwsh
        run: '"${{ github.workspace }}\vendor\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Tests with synthetic media
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Freeze desktop app
        run: python -m PyInstaller --noconfirm packaging/studio.spec
      - name: Check Qt Multimedia payload
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/AIShortsStudio -Recurse -File
          if (-not ($files | Where-Object Name -Match 'Qt6Multimedia.dll')) { throw 'Qt Multimedia DLL missing' }
          if (-not ($files | Where-Object Name -Match 'ffmpegmediaplugin.dll')) { throw 'Qt FFmpeg backend missing' }
          if (-not ($files | Where-Object Name -Match 'avcodec.*dll')) { throw 'Qt codec libraries missing' }
      - name: Frozen app smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/AIShortsStudio/AIShortsStudio.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Startup timeout' }
          if ($p.ExitCode -ne 0) { throw "Startup failed: $($p.ExitCode)" }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Frozen local AI engine smoke test
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'ai-smoke.json'
          $p = Start-Process dist/AIShortsStudio/AIShortsStudio.exe -ArgumentList @('--ai-smoke-test', $result) -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'AI startup timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'AI runtime/VAD test failed' }
          Get-Content $result
        env:
          HF_HUB_OFFLINE: '1'
      - name: Compile installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AIShortsStudio-0.2.0-windows-x64
          path: |
            dist/installer/*.exe
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
